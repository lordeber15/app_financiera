server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea /api cae en index.html
    location / {
        try_files $uri /index.html;
    }

    # Reenvía las llamadas de la API al backend (mismo origen para el navegador,
    # así la cookie de sesión funciona sin configurar CORS entre orígenes).
    location /api/ {
        proxy_pass http://backend:8014/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
